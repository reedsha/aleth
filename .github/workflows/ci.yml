name: CI

# A verification script that requires manual execution does not exist; it bit-rots. Every gate the
# project claims is a gate here, and the pipeline is the thing that runs them.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the previous run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ``.env`` is gitignored, so the suite must be given a seam. No test makes a real call -- the
  # completers are scripted and the transports stubbed -- but several build a real agent, and
  # ``create_deep_agent`` constructs ``ChatOpenAI``, which requires a key to exist at all.
  OPENAI_API_KEY: sk-ci-placeholder
  OPENAI_BASE_URL: https://example.invalid/v1
  ALETH_EMBEDDER: hashing
  ALETH_SYSTEM2: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  # Flush stdout per line. A CI log that arrives in 8 KB blocks hides *where* a run hung, which is
  # the only question a failing pipeline asks.
  PYTHONUNBUFFERED: "1"
  # A silent apt prompt (tzdata, most often) hangs a runner until its timeout. Never interactive.
  DEBIAN_FRONTEND: "noninteractive"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: ``dependency-cruiser@18`` and ``watskeburt@6`` declare
          # ``node: ^22||^24||>=26``, so 20 emits EBADENGINE on a clean install.
          node-version: "22"
          cache: npm
      - name: Install the UI toolchain
        run: npm ci
      - name: ESLint and the dependency-cruiser gate
        run: npm run lint
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax gate
        # The project's lint gate is the frontend one (ESLint + depcruise); this is the cheap
        # Python half -- every module must at least parse.
        run: python -m compileall -q agents core orchestration storage tools app.py bridge_bus.py env_boot.py main.py registry.py

  test-native:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The floor is 3.11 because that is what the deployment environments actually run --
        # Debian 12 ships 3.11, Ubuntu 22.04 ships 3.10, and a local CLI cannot demand a custom
        # interpreter. 3.13 is deliberately absent: heavyweight C extensions (torch, pyo3) lag on
        # wheel publication, and a leg that cannot install tests nothing but the calendar.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Mandatory for a pipeline whose dependencies are gigabytes: without it every run
          # cold-downloads torch, lancedb and transformers again.
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the system libraries the wheels link against
        # A raw Ubuntu runner is not a developer machine. It does not carry the shared libraries
        # the ML and native wheels need: torch links libgomp1 (OpenMP), pyo3/maturin need a C
        # toolchain, and pkg-config/libssl-dev cover anything that has to build from source.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgomp1 libglib2.0-0 libssl-dev curl
      - name: Build the compiled core
        shell: bash
        # ``crates/deepagents_core/rust-toolchain.toml`` names a host-neutral channel, so it needs
        # no per-OS override: it resolves to this runner's own default toolchain. (A
        # fully-qualified channel would be a machine fact, not a repository one -- rustup rejects
        # it outright when the named toolchain is not installed.)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e crates/deepagents_core
      - name: Install the kernel and its test extra
        run: python -m pip install -e ".[test]"
      - name: Build the sandbox image
        # Linux runners have a daemon, so the container-backed isolation tests actually run here
        # instead of skipping -- and the image is built once, up front, rather than cold inside a
        # test's own timeout.
        if: runner.os == 'Linux'
        run: docker build -f docker/sandbox.Dockerfile -t aleth-sandbox:latest docker/
      - name: Full suite
        # Run **unprivileged**. Root bypasses POSIX DAC bits (``CAP_DAC_OVERRIDE``), so a permission
        # assertion evaluated as root asserts nothing -- the immutability proof failed on exactly
        # that before it ran the boot as an ordinary user. GitHub's runner user is already
        # unprivileged, so the ``root`` branch below only ever fires in local emulation, which is
        # the point: it makes the emulated runner behave like the real one.
        #
        # ``shell: bash`` is load-bearing on Windows: the body is POSIX shell, and the default
        # shell there is PowerShell, which cannot parse it at all.
        shell: bash
        run: |
          set -e
          if [ "$(id -u)" -eq 0 ]; then
            # The emulated runner is root and reaches the daemon through a socket it owns; the
            # unprivileged user needs the same reach before we drop to it.
            chmod 666 /var/run/docker.sock 2>/dev/null || true
            useradd -m -s /bin/bash alethrunner 2>/dev/null || true
            chown -R alethrunner:alethrunner .
            su alethrunner -c "python -m pytest -v -s"
          else
            python -m pytest -v -s
          fi

  test-immutable:
    name: test-immutable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the build frontend
        run: python -m pip install --upgrade pip build
      - name: Build the sandbox image
        # The boot below executes a command through the container perimeter, and the perimeter
        # refuses rather than runs natively when the image is absent. The wheel does not ship the
        # Dockerfile -- it is an artifact of the checkout -- so the image is built here, from the
        # repository, exactly as the native job builds it.
        run: docker build -f docker/sandbox.Dockerfile -t aleth-sandbox:latest docker/
      - name: Build the wheel, lock it, and boot from it
        # The only acceptable proof of immutability: the wheel is installed into an isolated venv,
        # every write bit is stripped from the installed application, and the kernel is booted. If it
        # writes a log, a .pyc or a SQLite journal into its own tree, the OS denies it and this job
        # fails. A soft "nothing was written" assertion would not.
        env:
          ALETH_IMMUTABLE_PYTHON: python
        run: sh tools/verify_immutable_install.sh
