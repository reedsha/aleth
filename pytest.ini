[pytest]
# The backend suite is still written as stdlib `unittest.TestCase` classes -- pytest runs
# those natively, so the migration is a runner change rather than a rewrite of 400 tests
# that already pin the behaviour they were written to pin.
testpaths = tests
python_files = test_*.py
# `-n auto` gives each CPU a worker. The tests are isolated by construction: the
# workspace suite points the project and plan directories at a throwaway directory in
# setUp, so a worker's globals are its own. The one file every worker shares is the real
# ``plan.json`` beside the repo's PLAN.md, which the plan-state engine writes under an
# OS-level lock (crates/deepagents_core/src/state.rs).
addopts = -q -n auto
# A test that needs the live Laya checkpoint (a ~0.8 GB download on first use). Model
# stochasticity and the checkpoint's own out-of-range temperatures make these unfit for the
# default path, so CI runs ``-m "not llm"`` and they are exercised on demand. Every other test
# injects a fake classifier (``tests/conftest.py``, ``tests/test_routing.py``).
markers =
    llm: needs a live model checkpoint; excluded from the standard CI run
